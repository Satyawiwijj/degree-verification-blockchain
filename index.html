<!DOCTYPE html>
<html>
<head>
  <title>Degree Certificate on Blockchain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Degree Certificate System</h1>

    <div class="section">
      <h2>Issue Certificate (Admin Only)</h2>
      <input type="text" id="name" placeholder="Student Name" />
      <input type="text" id="course" placeholder="Course" />
      <input type="text" id="regno" placeholder="Register No" />
      <input type="text" id="year" placeholder="Year" />
      <button onclick="issueCertificate()">Issue Certificate</button>
      <p id="issueStatus"></p>
    </div>

    <div class="section">
      <h2>Verify Certificate</h2>
      <input type="text" id="verifyRegNo" placeholder="Enter Register No" />
      <button onclick="verifyCertificate()">Verify</button>
      <p id="verifyResult"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
